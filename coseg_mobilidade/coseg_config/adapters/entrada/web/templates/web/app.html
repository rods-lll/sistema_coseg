{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COSEG Mobilidade</title>
  <meta name="description" content="Reserva de veículos do Porto do Itaqui">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23121412'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%237CF0A8'/%3E%3C/svg%3E">
</head>
<body>
  <a class="pular" href="#app">Pular para o conteúdo</a>

  <header class="topo">
    <a class="marca" href="#/" aria-label="COSEG Mobilidade, início">
      <span class="marca-ponto" aria-hidden="true"></span>
      <span>COSEG</span>
    </a>
    <nav class="menu" aria-label="Principal">
      <a href="#/" data-rota="inicio">Início</a>
      <a href="#/agenda" data-rota="agenda">Agenda</a>
      <a href="#/nova" data-rota="nova"><span class="so-desktop">Nova reserva</span><span class="so-celular">Nova</span></a>
      <a href="#/reservas" data-rota="reservas">Reservas</a>
      <a href="#/frota" data-rota="frota">Frota</a>
    </nav>
    <div class="topo-direita">
      <span class="pilula pilula-contorno mono" id="relogio" aria-label="Hora atual">--:--</span>
      <span class="pilula pilula-escura">PBL 2</span>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="carregando" role="status"><span class="spinner" aria-hidden="true"></span> Carregando…</div>
  </main>

  <a class="fab" href="#/nova" id="fab" aria-label="Nova reserva">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </a>

  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo"></dialog>
  <div id="avisos" class="avisos" aria-live="assertive"></div>

  <noscript><p class="noscript">Ative o JavaScript para usar o COSEG Mobilidade.</p></noscript>
  <script type="module" src="{% static 'web/js/main.js' %}"></script>
</body>
</html>
